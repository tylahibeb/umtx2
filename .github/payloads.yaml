      - drakmor
      - sleirsgoevy
      - EchoStretch
      - zecoxao
      - flatz
      - idlesauce
      - buzzer-re
      - Al-Azif
      - john-tornblom
    projectUrl: https://github.com/drakmor/kstuff-lite
    sourceType: github-release
    sourceRepo: drakmor/kstuff-lite
    sourcePattern: kstuff*.elf
    toPort: 9021
    supportedFirmwares: ["3.", "4.", "5."]
    license:
      type: ""
      url: ""

