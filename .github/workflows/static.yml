name: Deploy to Github Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_payload_update:
        description: 'Force payload update even if no changes'
        required: false
        default: false
        type: boolean
  # Every 3 hours: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-payloads:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.update.outputs.has_changes }}
      site_sha: ${{ steps.site_ref.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Update payloads
        id: update
        run: |
          python .github/scripts/update_payloads.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate appcache manifest
        if: success()
        # Keep offline.html/offline.appcache in sync with the generated payload map
        # so on-disk hashes + metadata.json entries for new/changed payloads
        # are picked up. `git add .` in the next step will include any diff.
        run: |
          python appcache_manifest_generator.py -d document/en/ps5

      - name: Commit changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            # Get list of changed payloads
            CHANGES=$(git diff --name-only -- 'document/en/ps5/payloads/*/metadata.json' | sed 's|document/en/ps5/payloads/||g' | sed 's|/metadata.json||g' | tr '\n' ', ' | sed 's/,$//')
            
            # Create detailed commit message
            if [ -n "$CHANGES" ] || [ -n "$(git diff --name-only --diff-filter=D -- document/en/ps5/payloads)" ]; then
              git add .
              git commit -m "chore(payloads): update ${CHANGES:-retained versions}

          Automated payload update:
          - Synced with latest GitHub releases
          - Updated metadata and changelogs
          - Verified compatibility

          Run: $(date '+%Y-%m-%d %H:%M UTC')"
              git push
            fi
          fi

      - name: Record source revision
        id: site_ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-pages:
    needs: update-payloads
    runs-on: ubuntu-latest
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-payloads.outputs.site_sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Run appcache_manifest_generator.py
        run: |
          python appcache_manifest_generator.py -d document/en/ps5

      - name: Report published site size
        run: du -sb document/en/ps5

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: 'document/en/ps5'

  deploy:
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Record artifact identity
        env:
          ARTIFACT_NAME: ${{ needs.build-pages.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.build-pages.outputs.artifact_id }}
        run: echo "Deploying $ARTIFACT_NAME (artifact ID $ARTIFACT_ID)"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build-pages.outputs.artifact_name }}
